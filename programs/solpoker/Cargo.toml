[package]
name = "solpoker"
version = "0.1.0"
description = "Real-time on-chain Texas Hold'em with TEE-protected hole cards"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solpoker"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
# Chip custody is USDC, so the vault is a token account and buy/sell are token
# CPIs. Default features on purpose: `idl-build` reaches for `token_interface`,
# which only exists with token_2022 compiled in.
anchor-spl = "=1.0.2"
ephemeral-rollups-sdk = { version = "0.16.2", features = [
    "anchor",
    "access-control",
    "vrf",
] }
session-keys = { version = "=3.1.1", features = ["no-entrypoint"] }
poker-engine = { path = "../../crates/poker-engine" }
# Same SHA-256 the shuffle uses, so commitments and the seed agree.
sha2 = { version = "0.10", default-features = false }
