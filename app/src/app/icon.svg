<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    The browser tab mark. Same geometry as components/primitives/Logo.tsx, and
    the two must be changed together or the tab and the header stop agreeing.
    Next.js serves this as the favicon by file convention; there is no <link>
    to keep in step.
  -->
