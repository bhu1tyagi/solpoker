[package]
name = "poker-engine"
version = "0.1.0"
edition = "2021"
description = "Chain-agnostic Texas Hold'em rules engine: hand evaluation, betting state machine, and side-pot construction. No Solana dependencies."
license = "MIT"

[dependencies]
# Only used by the deterministic shuffle, so a verifier in any language can
# reproduce a deck from a published seed. Nothing else in the crate hashes.
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
proptest = "1"

[features]
default = []

[profile.release]
overflow-checks = true
