[workspace]
members = ["programs/*", "crates/poker-engine"]
# phase0-private-counter and crates/cu-bench are standalone workspaces with their
# own toolchain needs; keeping them out avoids dependency unification with the
# game program.
exclude = ["phase0-private-counter", "crates/cu-bench"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
